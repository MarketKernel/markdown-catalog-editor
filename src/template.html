<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Редактор заметок</title>
<link rel="icon" href="__ICON__">
<style>/*__STYLES__*/</style>
</head>
<body>

<section id="gate" class="gate">
  <div class="gate-inner">
    <img class="gate-logo" src="__ICON__" alt="">
    <p class="eyebrow">локальный редактор · один файл</p>
    <h1>Откройте папку<br><em>с заметками</em></h1>
    <p class="gate-copy">
      Выберите папку с файлами <code>.md</code>. Ничего никуда не отправляется:
      файлы читаются и сохраняются прямо на вашем диске.
    </p>
    <p id="browser-note" class="gate-note" hidden></p>
    <button id="open-folder" class="button button--primary" type="button">Открыть папку <span>→</span></button>
    <p class="gate-hint">или перетащите папку сюда</p>
    <input id="folder-picker" type="file" webkitdirectory multiple hidden>
    <p id="gate-error" class="gate-error" aria-live="polite"></p>
  </div>
</section>

<div id="app" class="app" hidden>
  <aside class="sidebar">
    <div class="sidebar-top">
      <button id="vault-name" class="vault" type="button" title="Открыть другую папку">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span id="vault-label">Заметки</span>
      </button>
      <div class="sidebar-actions">
        <button id="new-note" class="icon-button" type="button" title="Новая заметка">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
        </button>
        <button id="new-folder" class="icon-button" type="button" title="Новая папка">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v6M9 14h6"/></svg>
        </button>
      </div>
    </div>
    <div class="sidebar-search">
      <input id="tree-filter" type="search" placeholder="Фильтр по имени" aria-label="Фильтр файлов" autocomplete="off">
    </div>
    <div class="sidebar-heading"><span>Заметки</span><span id="note-count" class="count"></span></div>
    <nav id="tree" class="tree" aria-label="Дерево файлов"></nav>
  </aside>

  <div id="sidebar-resizer" class="resizer" role="separator" aria-orientation="vertical"
       aria-label="Ширина панели файлов" tabindex="0"></div>

  <main class="workspace">
    <header class="toolbar">
      <div class="toolbar-group">
        <button id="toggle-sidebar" class="icon-button" type="button" title="Панель файлов (⌘\)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
        <div class="segmented" role="group" aria-label="Режим">
          <button class="seg" type="button" data-mode="read">Чтение</button>
          <button class="seg" type="button" data-mode="edit">Правка</button>
        </div>
        <button id="save" class="icon-button" type="button" title="Сохранить (⌘S)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l4 4v12a0 0 0 0 1 0 0H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M8 4v5h7M8 20v-6h8v6"/></svg>
        </button>
      </div>

      <div id="format" class="toolbar-group toolbar-group--format">
        <button class="tool" type="button" data-heading="1" title="Заголовок 1 (⌘⌥1)">H1</button>
        <button class="tool" type="button" data-heading="2" title="Заголовок 2 (⌘⌥2)">H2</button>
        <button class="tool" type="button" data-heading="3" title="Заголовок 3 (⌘⌥3)">H3</button>
        <button class="tool" type="button" data-heading="0" title="Обычный текст (⌘⌥0)">¶</button>
        <span class="tool-sep"></span>
        <button class="tool tool--bold" type="button" data-action="bold" title="Жирный (⌘B)">Ж</button>
        <button class="tool tool--italic" type="button" data-action="italic" title="Курсив (⌘I)">К</button>
        <button class="tool tool--strike" type="button" data-action="strike" title="Зачёркнутый">З</button>
        <button class="tool tool--mono" type="button" data-action="code" title="Моноширинный (⌘⇧C)">&lt;&gt;</button>
        <button class="tool tool--mark" type="button" data-action="mark" title="Выделение маркером (⌘⇧H)">М</button>
        <button id="color" class="tool tool--color" type="button" title="Цвет текста и фона" aria-haspopup="true">
          <span class="color-swatch"></span>Ц
        </button>
        <span class="tool-sep"></span>
        <button class="tool" type="button" data-action="link" title="Ссылка (⌘K)">⧉</button>
        <button class="tool" type="button" data-action="wikilink" title="Ссылка на заметку ⌘⇧K">[[ ]]</button>
        <span class="tool-sep"></span>
        <button class="tool" type="button" data-action="bullet" title="Маркированный список">•—</button>
        <button class="tool" type="button" data-action="ordered" title="Нумерованный список">1.</button>
        <button class="tool" type="button" data-action="task" title="Список задач">☑</button>
        <button class="tool" type="button" data-action="quote" title="Цитата">❝</button>
        <button class="tool" type="button" data-action="codeblock" title="Блок кода">▤</button>
        <button class="tool" type="button" data-action="table" title="Таблица">⊞</button>
        <button class="tool" type="button" data-action="rule" title="Разделитель">—</button>
      </div>

      <div class="toolbar-group toolbar-group--right">
        <button id="find" class="icon-button" type="button" title="Поиск (⌘F)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
        <div class="zoom" role="group" aria-label="Масштаб">
          <button id="zoom-out" class="icon-button" type="button" title="Мельче (⌘−)">−</button>
          <button id="zoom-reset" class="zoom-value" type="button" title="Сбросить масштаб (⌘0)">100%</button>
          <button id="zoom-in" class="icon-button" type="button" title="Крупнее (⌘+)">+</button>
        </div>
        <button id="theme" class="icon-button" type="button" title="Тема">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>
        </button>
      </div>
    </header>

    <div id="findbar" class="findbar" hidden>
      <input id="find-input" type="search" placeholder="Найти в заметке" aria-label="Найти" autocomplete="off">
      <span id="find-count" class="find-count">0 / 0</span>
      <button id="find-prev" class="icon-button" type="button" title="Предыдущее (⇧Enter)">↑</button>
      <button id="find-next" class="icon-button" type="button" title="Следующее (Enter)">↓</button>
      <label class="find-case"><input id="find-case" type="checkbox"> Аа</label>
      <button id="find-close" class="icon-button" type="button" title="Закрыть (Esc)">✕</button>
    </div>

    <div id="scroller" class="scroller" tabindex="0">
      <div id="doc" class="doc"></div>
      <div id="placeholder" class="placeholder">
        <p>Выберите заметку слева или создайте новую.</p>
      </div>
    </div>

    <footer class="statusbar">
      <span id="status-path" class="status-path">—</span>
      <span id="status-state" class="status-state"></span>
      <span class="status-spacer"></span>
      <span id="status-count" class="status-count"></span>
    </footer>
  </main>
</div>

<div id="palette" class="palette" hidden></div>

<script>/*__APP__*/</script>
</body>
</html>
