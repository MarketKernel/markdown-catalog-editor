name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create or update (for example, v0.12.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build the single file and the extension
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          # On a manual run github.ref points at the branch, but the tag's own
          # sources are what must be built.
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The version lives in package.json only; `npm version x.y.z` writes it and makes the tag.
      - name: Check that the tag is package.json's version
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$RELEASE_TAG" ]; then
            echo "::error::The tag is $RELEASE_TAG but package.json has $VERSION"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:browser

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp build/macaed.html "dist/macaed-$RELEASE_TAG.html"
          # "Send to Markdown" for the Chrome Web Store; its manifest has package.json's version.
          cp build/macaed-extension-*.zip "dist/macaed-extension-$RELEASE_TAG.zip"
          # Computed from dist, or the sums file would hold a path, not a file name.
          ( cd dist && shasum -a 256 ./*.html ./*.zip > SHA256SUMS.txt )
          cat dist/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: markdown-catalog-editor
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: markdown-catalog-editor
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Markdown Catalog Editor $RELEASE_TAG" \
              --generate-notes
          fi
