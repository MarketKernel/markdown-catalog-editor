name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # ubuntu-latest ships Chrome at /usr/bin/google-chrome, where the browser tests look:
      # the editor, the HTML → Markdown converter, the PWA offline and updating, the extension.
      - run: npm run test:browser

      # The single HTML file must not pull anything off the network.
      - name: No external references in the build
        run: |
          if grep -oE '(src|href)="(https?:)?//[^"]*"' build/macaed.html; then
            echo "::error::external resources are left in build/macaed.html"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: markdown-catalog-editor
          path: |
            build/macaed.html
            build/macaed-extension-*.zip
